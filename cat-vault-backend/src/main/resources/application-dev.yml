# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cat_vault?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET}

# CORS 允许的前端地址
cors:
  allowed-origins: http://localhost:3000,http://localhost:8000
